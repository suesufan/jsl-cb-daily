name: daily-report

on:
  schedule:
    # 主触发：cron-job.org 每天 10:00 准点调 workflow_dispatch（秒级执行，已验证）。
    # 此处仅保留一个兜底：若外部触发当天失败（如 cron-job.org 挂了），
    # 这条会补跑一次；当天已推送过则由 main.py 幂等跳过，不会重复打扰。
    # 注：GitHub schedule 对免费仓库可能延迟数小时，属正常，仅作保险。
    - cron: '35 2 * * *'   # 名义北京 10:35
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and push report
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          # 定时触发时幂等跳过重复；手动触发时强制重推
          SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python main.py

      - name: Archive report
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: $(TZ='Asia/Shanghai' date +'%Y-%m-%d')" || echo "nothing to commit"
          git push
