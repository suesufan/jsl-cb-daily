name: daily-report

on:
  schedule:
    # GitHub schedule 触发不可靠（私有仓库优先级低，可能延迟数小时甚至丢弃），
    # 因此在 09:52~10:35 之间设 5 次尝试；配合 main.py 的幂等判断，只有首次成功会真正推送
    - cron: '52 1 * * *'   # 北京 09:52
    - cron: '3 2 * * *'    # 北京 10:03
    - cron: '12 2 * * *'   # 北京 10:12
    - cron: '23 2 * * *'   # 北京 10:23
    - cron: '35 2 * * *'   # 北京 10:35 兜底
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and push report
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          # 定时触发时幂等跳过重复；手动触发时强制重推
          SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python main.py

      - name: Archive report
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: $(TZ='Asia/Shanghai' date +'%Y-%m-%d')" || echo "nothing to commit"
          git push
