name: daily-report

on:
  schedule:
    # 北京时间 09:52（UTC 01:52）——避开整点/第 0 分钟的高负载时段，
    # GitHub 定时通常延迟几分钟，实际到达约 09:55~10:10
    - cron: '52 1 * * *'
    # 兜底重试：北京 10:35（UTC 02:35）；若首次已成功推送，脚本会幂等跳过
    - cron: '35 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and push report
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          # 定时触发时幂等跳过重复；手动触发时强制重推
          SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python main.py

      - name: Archive report
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: $(TZ='Asia/Shanghai' date +'%Y-%m-%d')" || echo "nothing to commit"
          git push
